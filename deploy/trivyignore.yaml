# Accepted Trivy findings for the image scan gate in CI (W8, #28). Each entry names the affected image,
# why it is accepted, the owner and an expiry: after expired_at the finding fails the gate again.
# Only findings with no fixed upstream image may be listed; first reviewed 2026-11-28.
vulnerabilities:
  # postgres:18 (newest digest as of 2026-11-28). zstd information disclosure; fixed in Debian, not yet in the image.
  - id: CVE-2026-124851
    statement: "postgres:18 base layer, no rebuilt image yet. Owner: mycaravam-crypto. Bump postgres when available."
    expired_at: 2027-01-31

  # postgres:18: gosu is built with an old Go toolchain. It runs only in the entrypoint to drop root
  # and opens no network connections, so the TLS, x509 and net findings are not reachable.
  - id: CVE-2025-61726
    paths: ["usr/local/bin/gosu"]
    statement: "gosu in postgres:18, entrypoint privilege drop only, no network use. Owner: mycaravam-crypto."
    expired_at: 2027-01-31
