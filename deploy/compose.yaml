# ZIRRUS reference deployment (#10, ADR 0008). Production defaults; see compose.dev.yaml and compose.test.yaml.
# Secrets are files under deploy/secrets/ (create them with deploy/init-secrets.sh; never committed).
name: zirrus

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp"]
  restart: unless-stopped

services:
  postgres:
    image: postgres:18@sha256:64c8b0d31e4ab6ea665e8426ea406a94bf52de3c05b3a4a8bf713704eefa9328
    environment:
      POSTGRES_DB: zirrus
      POSTGRES_USER: zirrus
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - pgdata:/var/lib/postgresql
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zirrus -d zirrus"]
      interval: 5s
      timeout: 3s
      retries: 12
    shm_size: 256m
    mem_limit: 1g
    restart: unless-stopped

  migrate:
    build: { context: .., dockerfile: deploy/docker/migrate.Dockerfile }
    image: zirrus-migrate:local
    <<: *hardening
    restart: "no"
    secrets:
      - source: zirrus_db
        target: ConnectionStrings__Zirrus
    networks: [data]
    depends_on:
      postgres: { condition: service_healthy }
    mem_limit: 256m

  # Gives the application role zirrus_app (created by the migrations) its login on every deployment.
  # The API and worker connect as zirrus_app; only migrations and this job use the owner account.
  db-roles:
    image: postgres:18@sha256:64c8b0d31e4ab6ea665e8426ea406a94bf52de3c05b3a4a8bf713704eefa9328
    <<: *hardening
    restart: "no"
    user: "999:999"
    entrypoint: ["/bin/sh", "/scripts/app-role.sh"]
    secrets: [postgres_password, app_db_password]
    volumes:
      - ./postgres/app-role.sh:/scripts/app-role.sh:ro
    networks: [data]
    depends_on:
      migrate: { condition: service_completed_successfully }
    mem_limit: 64m

  api:
    build: { context: .., dockerfile: deploy/docker/api.Dockerfile }
    image: zirrus-api:local
    <<: *hardening
    environment:
      # Production: set the identity provider (ADR 0007) and supply Auth__ClientSecret as a secret.
      Auth__Authority: ${ZIRRUS_OIDC_AUTHORITY:-}
    secrets:
      - source: zirrus_app_db
        target: ConnectionStrings__Zirrus
      - source: dataprotection_key
        target: DataProtection__Key
    volumes:
      - blobs:/var/lib/zirrus/blobs
    networks: [backend, data]
    depends_on:
      db-roles: { condition: service_completed_successfully }
    mem_limit: 512m
    cpus: 2

  worker:
    build: { context: .., dockerfile: deploy/docker/worker.Dockerfile }
    image: zirrus-worker:local
    <<: *hardening
    secrets:
      - source: zirrus_app_db
        target: ConnectionStrings__Zirrus
      - source: audit_digest_key
        target: Audit__DigestKey
    environment:
      Scanner__Host: clamav
      Renderer__Url: http://renderer:8080
      # Signed audit digests (Q10) are also written here; back this volume up off-host (deployment-delivery.md).
      Audit__ExportDirectory: /var/lib/zirrus/audit
    volumes:
      - blobs:/var/lib/zirrus/blobs
      - audit_digests:/var/lib/zirrus/audit
    # Not waiting for ClamAV or the renderer: while either is unavailable, stages fail and retry (ingestion-api-ui.md).
    networks: [data, scanner, render]
    depends_on:
      db-roles: { condition: service_completed_successfully }
    mem_limit: 512m
    cpus: 2

  # Isolated parser (W4): decodes untrusted images in a fresh child process per file with a 60 s and
  # 512 MiB limit. It holds no secrets or volumes and can reach nothing: its only network is internal
  # and shared with the worker, so a compromised decoder cannot touch PostgreSQL, blobs or the internet.
  renderer:
    build: { context: .., dockerfile: deploy/docker/renderer.Dockerfile }
    image: zirrus-renderer:local
    <<: *hardening
    networks: [render]
    mem_limit: 768m
    pids_limit: 64
    cpus: 2

  # Malware scanner (GPL-2.0, separate service reached over clamd's TCP protocol; nothing is linked).
  # It needs outbound access for signature updates (freshclam) and is reachable only from the worker.
  clamav:
    image: clamav/clamav:1.5.5@sha256:64e30c0bf976198024deb3dc6d5cfe2485fb969c0f73549ba0fdb364b9469614
    security_opt: ["no-new-privileges:true"]
    volumes:
      - clamav_db:/var/lib/clamav
    networks: [scanner, egress]
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s
    mem_limit: 2g
    restart: unless-stopped

  web:
    build: { context: .., dockerfile: deploy/docker/web.Dockerfile }
    image: zirrus-web:local
    <<: *hardening
    environment:
      ZIRRUS_SITE_ADDRESS: ${ZIRRUS_SITE_ADDRESS:-http://localhost}
    # Non-root Caddy may bind 80/443 inside its own network namespace only.
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 80
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks: [frontend, backend]
    depends_on:
      api: { condition: service_healthy }
    mem_limit: 256m

networks:
  frontend: {}
  backend: { internal: true }
  data: { internal: true }
  scanner: { internal: true }
  render: { internal: true }
  egress: {}

volumes:
  pgdata: {}
  # Originals and renditions (managed filesystem store, ADR 0006); back up together with pgdata.
  blobs: {}
  audit_digests: {}
  clamav_db: {}
  caddy_data: {}
  caddy_config: {}

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  zirrus_db:
    file: ./secrets/zirrus_db_connection
  app_db_password:
    file: ./secrets/app_db_password
  zirrus_app_db:
    file: ./secrets/zirrus_app_db_connection
  audit_digest_key:
    file: ./secrets/audit_digest_key
  dataprotection_key:
    file: ./secrets/dataprotection_key
