# CI end-to-end test (#21, #22, #19): plain HTTP on localhost, Keycloak test realm.
# Test-only credentials live in deploy/keycloak/zirrus-realm.json and here; never reuse them.
# The CI runner maps "keycloak" to 127.0.0.1 so browser and API share one issuer URL.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm", "--http-port=8180", "--health-enabled=true"]
    environment:
      KC_HOSTNAME: http://keycloak:8180
      KC_BOOTSTRAP_ADMIN_USERNAME: ci-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ci-test-only-keycloak-admin
    volumes:
      - ./keycloak/zirrus-realm.json:/opt/keycloak/data/import/zirrus-realm.json:ro
    ports:
      - "8180:8180"
    networks: [frontend, backend]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  api:
    environment:
      Auth__Authority: http://keycloak:8180/realms/zirrus
      Auth__ClientSecret: ci-test-only-client-secret
      Auth__AllowInsecureHttp: "true"
    depends_on:
      keycloak: { condition: service_healthy }

  worker:
    environment:
      # Short leases so jobs of a killed worker return quickly in the fault test (production: 2 min).
      Ingestion__Lease: "00:00:15"

  web:
    environment:
      ZIRRUS_SITE_ADDRESS: http://localhost
