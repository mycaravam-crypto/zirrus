# CI gates for every pull request and for main (ADR 0011). The DocWizz documentation gate runs
# in docwizz.yml. Actions are pinned by commit SHA; Dependabot proposes updates.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  backend:
    name: backend (build, test, OpenAPI contract)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with: { global-json-file: global.json }
      - name: Restore (locked)
        run: dotnet restore Zirrus.slnx --locked-mode
      - name: Build (warnings as errors; regenerates the OpenAPI document)
        run: dotnet build Zirrus.slnx -c Release --no-restore
      - name: OpenAPI document is current
        run: |
          git diff --exit-code -- packages/api-client/openapi \
            || { echo "::error::packages/api-client/openapi is stale: build locally and commit the regenerated document"; exit 1; }
      - name: Unit tests with coverage gate (Q8, ≥80% branch on domain and application)
        run: >
          dotnet test --project tests/Zirrus.Domain.Tests -c Release --no-build
          --coverlet --coverlet-output-format cobertura
          --coverlet-include '[Zirrus.Domain]*' --coverlet-include '[Zirrus.Application]*'
          --coverlet-threshold 80 --coverlet-threshold-type branch
      - name: Integration tests (PostgreSQL 18 via Testcontainers)
        run: dotnet test --project tests/Zirrus.Api.Tests -c Release --no-build --coverlet --coverlet-output-format cobertura
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: tests/**/TestResults/*.cobertura.*.xml
          if-no-files-found: ignore

  frontend:
    name: frontend (lint, types, tests, client regeneration)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, package-manager-cache: false }
      - name: Enable pnpm (version from package.json)
        run: corepack enable
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Generated API client is current
        run: |
          pnpm generate
          git diff --exit-code -- packages/api-client/src \
            || { echo "::error::packages/api-client/src/schema.ts is stale: run 'pnpm generate' and commit"; exit 1; }
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  supply-chain:
    name: supply chain (SBOM, licenses, vulnerabilities)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with: { global-json-file: global.json }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, package-manager-cache: false }
      - name: Restore
        run: |
          corepack enable
          dotnet tool restore
          dotnet restore Zirrus.slnx --locked-mode
          pnpm install --frozen-lockfile
      - name: License gate self-test
        run: python3 -I tools/ci/check-licenses.py --self-test
      - name: SBOMs (CycloneDX)
        run: |
          mkdir -p sbom
          dotnet CycloneDX Zirrus.slnx -o sbom -fn dotnet.cdx.json -F Json --exclude-test-projects
          dotnet CycloneDX Zirrus.slnx -o sbom -fn dotnet-all.cdx.json -F Json
          npx --yes @cyclonedx/cdxgen@12.9.3 -t pnpm --no-install-deps -r -o sbom/web.cdx.json .
          pnpm licenses list --json --prod > sbom/pnpm-prod.json
          pnpm licenses list --json > sbom/pnpm-all.json
      - name: License gate (ADR 0003)
        run: >
          python3 -I tools/ci/check-licenses.py
          --dotnet-runtime sbom/dotnet.cdx.json --dotnet-all sbom/dotnet-all.cdx.json
          --npm-prod sbom/pnpm-prod.json --npm-all sbom/pnpm-all.json
          --locks src/*/packages.lock.json tests/*/packages.lock.json
      - name: Vulnerable NuGet packages
        run: |
          dotnet list Zirrus.slnx package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q -E '^\s+>' vulnerable.txt; then echo "::error::vulnerable NuGet packages found"; exit 1; fi
      - name: Vulnerable npm packages (high and critical)
        run: pnpm audit --audit-level high
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: sbom, path: sbom/ }

  compose-smoke:
    name: compose smoke test (clean host)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Create secrets
        run: deploy/init-secrets.sh
      - name: Build and start (waits for health checks)
        run: docker compose -f deploy/compose.yaml -f deploy/compose.test.yaml up -d --build --wait --wait-timeout 300
      - name: Smoke checks through Caddy
        run: |
          set -euo pipefail
          curl -fsS http://localhost/ | grep -q '<div id="root">'
          test "$(curl -fsS http://localhost/api/v1/catalogs)" = "[]"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/openapi/v1.json)" = "404"
          published=$(docker compose -f deploy/compose.yaml ps --format json | python3 -c "
          import json, sys
          rows = [json.loads(l) for l in sys.stdin if l.strip()]
          print(' '.join(sorted({r['Service'] for r in rows for p in (r.get('Publishers') or []) if p.get('PublishedPort')})))")
          test "$published" = "web" || { echo "::error::only web may publish ports, found: $published"; exit 1; }
          echo "smoke test passed"
      - name: Logs on failure
        if: failure()
        run: docker compose -f deploy/compose.yaml logs --no-color
      - name: Tear down
        if: always()
        run: docker compose -f deploy/compose.yaml down -v
